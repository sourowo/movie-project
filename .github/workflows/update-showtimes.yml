name: 更新電影場次（不寫入 Git）

on:
  schedule:
    # 台灣時間每週三 17:13、19:13
    - cron: "13 17,19 * * 3"
      timezone: "Asia/Taipei"

  workflow_dispatch:

permissions:
  contents: write
  
concurrency:
  group: update-showtimes
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 取得爬蟲程式
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 爬取並產生場次 JSON
        run: python all_showtimes.py

      - name: 檢查產出
        run: |
          python -c "import json; data=json.load(open('showtimes.json', encoding='utf-8')); assert isinstance(data, list) and data, 'showtimes.json 是空的或格式不正確'; print(f'{len(data)} 筆場次')"

      - name: 產生可供 GitHub Pages 載入的資料檔
        run: |
          python -c "from pathlib import Path; data=Path('showtimes.json').read_text(encoding='utf-8'); Path('showtimes.js').write_text('window.__MOVIE_SHOWTIMES__ = ' + data + ';\n', encoding='utf-8')"

      - name: 建立固定資料 Release（首次才會執行）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view showtimes-data >/dev/null 2>&1 || gh release create showtimes-data --title "最新電影場次資料" --notes "由排程自動更新；此檔案不寫入 Git 歷史。"

      - name: 覆寫 Release 資料
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload showtimes-data showtimes.json showtimes.js --clobber
