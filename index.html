<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排片 · 電影場次</title>
<style>
/* ============================================================
   設計基調
   深松綠當主色，衝突用磚紅，太趕用赭黃。
   時間全部用等寬數字（tabular-nums），時刻表才會對齊。
   ============================================================ */
:root{
  --paper:#FBFAF7;
  --ink:#16161A;
  --muted:#74736E;
  --line:#E4E2DC;
  --pine:#1F4D46;
  --clash:#B23B32;
  --tight:#A9641E;
  --card:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",
              "Microsoft JhengHei",sans-serif;
  background:var(--paper); color:var(--ink);
  line-height:1.6; font-size:15px;
  padding-bottom:88px;               /* 讓底部浮動列不會蓋住內容 */
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
time,.num{font-variant-numeric:tabular-nums}

/* ---------- 頁首 ---------- */
header{padding:28px 0 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}

/* ---------- 分頁切換 ---------- */
.tabs{display:flex;gap:4px;margin-bottom:20px}
.tab{
  flex:1;padding:10px;border:1px solid var(--line);background:transparent;
  border-radius:8px;font:inherit;font-size:14px;color:var(--muted);
  cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.tab:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

/* ---------- 篩選 ---------- */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.filters label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
select,input[type=search]{
  width:100%;padding:9px 10px;font:inherit;font-size:14px;
  border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);
}
.filters .full{grid-column:1/-1}
select:focus,input:focus{outline:2px solid var(--pine);outline-offset:-1px}

/* ---------- 場次列表 ---------- */
.count{font-size:13px;color:var(--muted);margin:14px 0 8px}
.row{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer;
}
.row:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.row[data-picked="1"]{border-color:var(--pine);background:#F2F6F4}
.row .when{min-width:52px;font-size:17px;font-weight:600}
.row .body{flex:1;min-width:0}
.row .title{font-weight:600;word-break:break-word}
.row .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .mark{
  width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:13px;color:transparent;margin-top:2px;
}
.row[data-picked="1"] .mark{background:var(--pine);border-color:var(--pine);color:#fff}

/* 規格標籤 */
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.tag.fmt{border-color:#C9D6D2;color:var(--pine)}

/* ---------- 片單時間軸 ---------- */
.day{margin-bottom:26px}
.day h2{font-size:15px;font-weight:600;margin-bottom:10px}
.slot{display:flex;gap:12px;align-items:stretch}
.rail{min-width:52px;padding-top:12px;font-size:15px;font-weight:600}
.rail .end{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.slot .card{
  flex:1;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pine);
  border-radius:8px;padding:11px 13px;min-width:0;
}
.slot .card .title{font-weight:600;word-break:break-word}
.slot .card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.drop{background:none;border:none;font:inherit;font-size:12.5px;color:var(--clash);
      cursor:pointer;padding:4px 0 0;text-decoration:underline}

/* 兩場之間的空檔 / 警告 */
.gap{display:flex;gap:12px;align-items:center;font-size:12.5px;padding:6px 0}
.gap .rail{min-width:52px;padding:0}
.gap .txt{flex:1;color:var(--muted)}
.gap.warn .txt{color:var(--tight);font-weight:600}
.gap.bad .txt{color:var(--clash);font-weight:600}
.gap.bad+.slot .card,.slot.bad .card{border-left-color:var(--clash)}

/* ---------- 底部浮動列 ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:12px 16px;
}
.dock .wrap{display:flex;gap:10px;align-items:center;padding:0 16px}
.dock .n{flex:1;font-size:13.5px}
.btn{
  padding:10px 16px;border:none;border-radius:8px;background:var(--pine);color:#fff;
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;
}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:14px}

/* ---------- 頁尾 ---------- */
footer{
  border-top:1px solid var(--line);margin-top:32px;padding:20px 0 8px;
  font-size:12.5px;color:var(--muted);line-height:1.8;
}
footer a{color:var(--pine)}
footer p+p{margin-top:8px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.hide{display:none}

@media(prefers-reduced-motion:no-preference){
  .row{transition:border-color .12s,background .12s}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>排片</h1>
    <p class="sub" id="dataInfo">載入中…</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabFind" role="tab" aria-selected="true">找場次</button>
    <button class="tab" id="tabList" role="tab" aria-selected="false">我的片單</button>
  </div>

  <!-- ===== 找場次 ===== -->
  <section id="paneFind">
    <div class="filters">
      <div><label for="fDate">日期</label><select id="fDate"></select></div>
      <div><label for="fRegion">地區</label><select id="fRegion"></select></div>
      <div><label for="fCinema">影城</label><select id="fCinema"></select></div>
      <div><label for="fMovie">電影</label><select id="fMovie"></select></div>
      <div class="full">
        <label for="fText">關鍵字</label>
        <input type="search" id="fText" placeholder="片名或影城">
      </div>
    </div>
    <p class="count" id="count"></p>
    <div id="results"></div>
  </section>

  <!-- ===== 我的片單 ===== -->
  <section id="paneList" class="hide">
    <div id="plan"></div>
  </section>

  <footer>
    <p>場次資料來源：<a href="https://www.atmovies.com.tw/"
       target="_blank" rel="noopener">開眼電影網</a>
       　資料每日更新，實際場次與票價請以各影城公告為準。</p>
    <p>結束時間為估計值，已加上約 12 分鐘廣告與預告。
       個人非營利專案，原始碼在
       <a href="https://github.com/sourowo/movie-project"
          target="_blank" rel="noopener">GitHub</a>。</p>
    <p style="opacity:.6">版本 2026-09-15d</p>
  </footer>
</div>

<div class="dock">
  <div class="wrap">
    <span class="n" id="dockText">片單是空的</span>
    <button class="btn ghost" id="btnClear" disabled>清空</button>
    <button class="btn" id="btnIcs" disabled>下載行事曆</button>
  </div>
</div>

<script>
/* ============================================================
   設定
   ============================================================ */

// 資料來源：GitHub Release 的固定 JavaScript asset。
// 爬蟲只會覆寫 Release asset，不會把幾 MB 的資料寫進 Git commit。
// Release JSON 無法跨網域 fetch；用 script 載入則不受該限制。
// 若此專案搬到別的 GitHub 帳號／repository，請同步修改這個網址。
const DATA_FILE = "https://github.com/sourowo/movie-project/releases/download/showtimes-data/showtimes.js";
const DATA_GLOBAL = "__MOVIE_SHOWTIMES__";

// 同一間影城，兩場之間至少要留幾分鐘（走出廳、上廁所、再進場）
const BUFFER_SAME = 15;

// 不同影城，至少要留幾分鐘（要移動）
// 這是保守的估計值，實際還是要自己看地圖
const BUFFER_MOVE = 60;

const STORE_KEY = "moviePlanner.picked.v1";


/* ============================================================
   狀態
   ============================================================ */

let ALL = [];                 // 全部場次
let PICKED = loadPicked();    // 已選場次（存在瀏覽器裡）


/* ============================================================
   小工具
   ============================================================ */

// 每一場的唯一編號，用來判斷有沒有重複選
function keyOf(s){
  return [s.theater_id, s.movie_id, s.start, s.version_raw||""].join("|");
}

// "2026-09-16T02:25:00+08:00" → Date 物件
function toDate(iso){ return new Date(iso); }

// Date → "14:30"
//
// 場次時間一律用台灣時間顯示。
// 不能直接用 getHours()，那是「看這台電腦的時區」，
// 人在國外開這個頁面，時刻表就會整個偏掉。
const TPE_HHMM = new Intl.DateTimeFormat("en-GB", {
  timeZone:"Asia/Taipei", hour:"2-digit", minute:"2-digit", hour12:false
});
function hhmm(d){ return TPE_HHMM.format(d); }

// "2026-09-16" → "9/16（三）"
//
// 直接拆字串算，不經過本地時區，
// 免得在別的時區變成前一天或後一天。
const WEEK = ["日","一","二","三","四","五","六"];
function dayLabel(ymd){
  const [y, m, d] = String(ymd).split("-").map(Number);
  const w = new Date(Date.UTC(y, m-1, d)).getUTCDay();
  return `${m}/${d}（${WEEK[w]}）`;
}

// 分鐘數 → "1 小時 20 分"
function minText(m){
  if(m < 60) return `${m} 分鐘`;
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h} 小時 ${r} 分` : `${h} 小時`;
}

function loadPicked(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function savePicked(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(PICKED)); }
  catch(e){ /* 無痕模式可能存不了，不影響當次使用 */ }
}


/* ============================================================
   衝突判斷
   ============================================================
   兩場的關係分三種：
     bad   兩場時間直接重疊 → 不可能都看到
     warn  沒重疊，但中間空檔太短 → 趕不上
     ok    正常
============================================================ */

function checkPair(a, b){
  const aEnd   = toDate(a.end_estimated || a.start);
  const bStart = toDate(b.start);

  // 中間空幾分鐘（負數代表重疊）
  const gap = Math.round((bStart - aEnd) / 60000);

  const sameCinema = a.theater_id === b.theater_id;
  const need = sameCinema ? BUFFER_SAME : BUFFER_MOVE;

  if(gap < 0){
    return { level:"bad", gap,
      text:`與上一場重疊 ${minText(-gap)}，無法都看` };
  }
  if(gap < need){
    return { level:"warn", gap,
      text: sameCinema
        ? `只有 ${minText(gap)}空檔，同影城建議至少留 ${BUFFER_SAME} 分鐘`
        : `只有 ${minText(gap)}空檔，還要從${a.cinema}移動到${b.cinema}` };
  }
  return { level:"ok", gap,
    text: sameCinema ? `空檔 ${minText(gap)}`
                     : `空檔 ${minText(gap)}，需移動到${b.cinema}` };
}


/* ============================================================
   兩種跳脫，用途完全不同，名字一定要分開
   ============================================================
   icsEsc  → 寫進 .ics 檔用（分號、逗號、反斜線要加 \）
   htmlEsc → 塞進 HTML 用（< > & " 要換成實體）

   （舊版兩個都叫 esc，後定義的把前面蓋掉，
     結果匯出的行事曆沒做 ics 跳脫，片名有逗號就會壞。）
============================================================ */

// .ics 專用
function icsEsc(t){
  return String(t||"")
    .replace(/\\/g,"\\\\").replace(/;/g,"\\;")
    .replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
}

// HTML 專用
function htmlEsc(t){
  return String(t==null?"":t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}


/* ============================================================
   匯出 .ics（行事曆檔）
   ============================================================
   時間一律轉成 UTC 並加上 Z 結尾，這是最不會出錯的寫法，
   Google 日曆、iPhone 行事曆、Outlook 都認得。
============================================================ */

// Date → "20260916T062500Z"
function utc(d){
  const p = n => String(n).padStart(2,"0");
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"T"
       + p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+"Z";
}

// ics 規定每行不能超過 75 個位元組，太長要折行（下一行開頭放一個空格）
function fold(line){
  const enc = new TextEncoder();
  if(enc.encode(line).length <= 75) return line;

  const out = [];
  let cur = "", curLen = 0;

  for(const ch of line){
    const n = enc.encode(ch).length;
    if(curLen + n > 75){
      out.push(cur);
      cur = " " + ch;            // 續行前面要加一個空格
      curLen = 1 + n;
    }else{
      cur += ch; curLen += n;
    }
  }
  out.push(cur);
  return out.join("\r\n");
}

function buildIcs(list){
  const now = utc(new Date());
  const L = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//MoviePlanner//TW//ZH",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
  ];

  list.forEach((s, i) => {
    const start = toDate(s.start);
    const end   = s.end_estimated ? toDate(s.end_estimated)
                : new Date(start.getTime() + 120*60000);   // 沒片長就抓 2 小時

    const badges = [].concat(s.formats||[], s.halls||[], s.languages||[]);

    const desc = [
      s.cinema,
      badges.length ? badges.join("、") : null,
      s.runtime_minutes ? `片長 ${s.runtime_minutes} 分鐘` : null,
      "結束時間為估計值（已含約 12 分鐘廣告預告）",
    ].filter(Boolean).join("\n");

    L.push(
      "BEGIN:VEVENT",
      fold(`UID:${utc(start)}-${i}@movieplanner.local`),
      `DTSTAMP:${now}`,
      `DTSTART:${utc(start)}`,
      `DTEND:${utc(end)}`,
      fold(`SUMMARY:${icsEsc(s.movie)}`),
      fold(`LOCATION:${icsEsc(s.cinema)}`),
      fold(`DESCRIPTION:${icsEsc(desc)}`),
    );
    if(s.movie_url) L.push(fold(`URL:${icsEsc(s.movie_url)}`));

    // 開演前 30 分鐘提醒
    L.push(
      "BEGIN:VALARM",
      "ACTION:DISPLAY",
      "TRIGGER:-PT30M",
      fold(`DESCRIPTION:${icsEsc(s.movie)} 快開演了`),
      "END:VALARM",
      "END:VEVENT",
    );
  });

  L.push("END:VCALENDAR");
  return L.join("\r\n");
}

function downloadIcs(){
  const list = sortedPicked();
  if(!list.length) return;

  const blob = new Blob([buildIcs(list)],
                        {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `我的片單_${list[0].actual_date||"行事曆"}.ics`;
  a.click();
  URL.revokeObjectURL(url);
}


/* ============================================================
   畫面：找場次
   ============================================================ */

const $ = id => document.getElementById(id);

function uniq(arr){ return [...new Set(arr)].sort(); }

function fillSelect(el, values, labelFn, allLabel){
  const keep = el.value;

  // 每個 option 都要明確寫 value。
  // 如果只寫 <option>文字</option>，瀏覽器會拿「顯示文字」當值，
  // 之後改了顯示文字，值也會跟著變，篩選就會對不上。
  el.innerHTML = `<option value="">${allLabel}</option>` +
    values.map(v =>
      `<option value="${htmlEsc(v)}">${htmlEsc(labelFn ? labelFn(v) : v)}</option>`
    ).join("");

  if(values.includes(keep)) el.value = keep;
}

function buildFilters(){
  // 值是 2026-09-15，但畫面上顯示 9/15（二）
  fillSelect($("fDate"),
    uniq(ALL.map(s => s.actual_date || s.date)),
    dayLabel, "全部日期");

  fillSelect($("fRegion"), uniq(ALL.map(s => s.region)), null, "全部地區");
  refreshDependent();
}

// 影城和電影跟著日期、地區變動
function refreshDependent(){
  const d = $("fDate").value, r = $("fRegion").value;
  const pool = ALL.filter(s =>
    (!d || (s.actual_date||s.date) === d) && (!r || s.region === r));

  fillSelect($("fCinema"), uniq(pool.map(s => s.cinema)), null, "全部影城");
  fillSelect($("fMovie"),  uniq(pool.map(s => s.movie)),  null, "全部電影");
}

function currentResults(){
  const d = $("fDate").value, r = $("fRegion").value;
  const c = $("fCinema").value, m = $("fMovie").value;
  const t = $("fText").value.trim().toLowerCase();

  return ALL.filter(s =>
    (!d || (s.actual_date||s.date) === d) &&
    (!r || s.region === r) &&
    (!c || s.cinema === c) &&
    (!m || s.movie  === m) &&
    (!t || s.movie.toLowerCase().includes(t)
        || s.cinema.toLowerCase().includes(t))
  ).sort((a,b) => a.start < b.start ? -1 : 1);
}

function badgeHtml(s){
  const fmt = (s.formats||[]).map(v => `<span class="tag fmt">${htmlEsc(v)}</span>`);
  const oth = [].concat(s.halls||[], s.languages||[], s.events||[])
                .map(v => `<span class="tag">${htmlEsc(v)}</span>`);
  const all = fmt.concat(oth);
  return all.length ? `<div class="tags">${all.join("")}</div>` : "";
}

function renderResults(){
  const list = currentResults();
  $("count").textContent = `${list.length.toLocaleString()} 場`;

  if(!list.length){
    $("results").innerHTML =
      `<p class="empty"><strong>這個組合沒有場次</strong>換個日期或地區看看</p>`;
    return;
  }

  const shown = list.slice(0, 300);      // 一次最多畫 300 筆，手機才不會卡
  const picks = new Set(PICKED.map(keyOf));

  $("results").innerHTML = shown.map(s => {
    const on = picks.has(keyOf(s)) ? "1" : "0";
    const end = s.end_estimated ? hhmm(toDate(s.end_estimated)) : "";
    return `
    <button class="row" data-picked="${on}" data-key="${htmlEsc(keyOf(s))}">
      <span class="mark">✓</span>
      <span class="when num">${hhmm(toDate(s.start))}
        <span style="display:block;font-size:11.5px;font-weight:400;color:var(--muted)">
          ${end ? "～"+end : ""}</span></span>
      <span class="body">
        <span class="title">${htmlEsc(s.movie)}</span>
        <span class="meta">${dayLabel(s.actual_date||s.date)}　${htmlEsc(s.cinema)}</span>
        ${badgeHtml(s)}
      </span>
    </button>`;
  }).join("") +
  (list.length > shown.length
    ? `<p class="count">還有 ${list.length-shown.length} 場，請再縮小範圍</p>` : "");
}

// 點一下 = 加入或移除片單
$("results").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if(!row) return;
  const k = row.dataset.key;
  const hit = ALL.find(s => keyOf(s) === k);
  if(!hit) return;

  const i = PICKED.findIndex(s => keyOf(s) === k);
  if(i >= 0) PICKED.splice(i,1); else PICKED.push(hit);

  savePicked();
  row.dataset.picked = i >= 0 ? "0" : "1";
  renderDock();
});


/* ============================================================
   畫面：我的片單
   ============================================================ */

function sortedPicked(){
  return [...PICKED].sort((a,b) => a.start < b.start ? -1 : 1);
}

function renderPlan(){
  const list = sortedPicked();

  if(!list.length){
    $("plan").innerHTML =
      `<p class="empty"><strong>還沒有選任何場次</strong>
       到「找場次」點選想看的電影，這裡會幫你檢查時間會不會撞到</p>`;
    return;
  }

  // 依日期分組
  const byDay = {};
  list.forEach(s => {
    const d = s.actual_date || s.date;
    (byDay[d] = byDay[d] || []).push(s);
  });

  $("plan").innerHTML = Object.keys(byDay).sort().map(d => {
    const day = byDay[d];
    let html = `<div class="day"><h2>${dayLabel(d)}</h2>`;

    day.forEach((s, i) => {
      // 這一場跟前一場的關係
      if(i > 0){
        const r = checkPair(day[i-1], s);
        const cls = r.level === "ok" ? "" : (r.level === "bad" ? "bad" : "warn");
        html += `<div class="gap ${cls}"><span class="rail"></span>
                 <span class="txt">${htmlEsc(r.text)}</span></div>`;
      }

      const end = s.end_estimated ? hhmm(toDate(s.end_estimated)) : "";
      const badges = [].concat(s.formats||[], s.halls||[], s.languages||[]);

      html += `
      <div class="slot">
        <div class="rail num">${hhmm(toDate(s.start))}
          <span class="end">${end ? "～"+end : ""}</span></div>
        <div class="card">
          <div class="title">${htmlEsc(s.movie)}</div>
          <div class="meta">${htmlEsc(s.cinema)}${
            badges.length ? "　"+htmlEsc(badges.join("、")) : ""}${
            s.runtime_minutes ? "　"+s.runtime_minutes+" 分鐘" : ""}</div>
          <button class="drop" data-key="${htmlEsc(keyOf(s))}">移除</button>
        </div>
      </div>`;
    });

    return html + `</div>`;
  }).join("");
}

$("plan").addEventListener("click", e => {
  const b = e.target.closest(".drop");
  if(!b) return;
  const i = PICKED.findIndex(s => keyOf(s) === b.dataset.key);
  if(i >= 0){ PICKED.splice(i,1); savePicked(); renderPlan(); renderDock(); renderResults(); }
});


/* ============================================================
   底部浮動列
   ============================================================ */

function renderDock(){
  const n = PICKED.length;
  const list = sortedPicked();

  // 算有幾組衝突
  let bad = 0, warn = 0;
  const byDay = {};
  list.forEach(s => {
    const d = s.actual_date || s.date;
    (byDay[d] = byDay[d] || []).push(s);
  });
  Object.values(byDay).forEach(day => {
    for(let i=1;i<day.length;i++){
      const lv = checkPair(day[i-1], day[i]).level;
      if(lv === "bad") bad++; else if(lv === "warn") warn++;
    }
  });

  let txt = n ? `已選 ${n} 場` : "片單是空的";
  if(bad)  txt += `　⚠ ${bad} 組重疊`;
  else if(warn) txt += `　${warn} 組偏趕`;

  $("dockText").textContent = txt;
  $("btnIcs").disabled = !n;
  $("btnClear").disabled = !n;
}


/* ============================================================
   分頁切換
   ============================================================ */

function showTab(which){
  const find = which === "find";
  $("tabFind").setAttribute("aria-selected", find);
  $("tabList").setAttribute("aria-selected", !find);
  $("paneFind").classList.toggle("hide", !find);
  $("paneList").classList.toggle("hide", find);
  if(!find) renderPlan();
}

$("tabFind").onclick = () => showTab("find");
$("tabList").onclick = () => showTab("list");

$("btnIcs").onclick = downloadIcs;
$("btnClear").onclick = () => {
  if(!confirm("確定要清空片單嗎？")) return;
  PICKED = []; savePicked();
  renderPlan(); renderDock(); renderResults();
};

["fDate","fRegion"].forEach(id =>
  $(id).addEventListener("change", () => { refreshDependent(); renderResults(); }));
["fCinema","fMovie"].forEach(id =>
  $(id).addEventListener("change", renderResults));
$("fText").addEventListener("input", renderResults);


/* ============================================================
   載入資料
   ============================================================
   從 GitHub Release 讀取最新的 showtimes.json。

   注意：一定要用網址開啟這個頁面（http:// 或 https://），
   直接點兩下開檔案（file://）會被瀏覽器的安全限制擋掉，
   fetch 會失敗。本機測試可以在資料夾裡跑：
     python3 -m http.server 8000
   然後開 http://localhost:8000
============================================================ */

async function loadData(){
  // GitHub Release asset 不能跨網域 fetch JSON，改用 script 載入。
  // showtimes.js 只會把資料指定給 window.__MOVIE_SHOWTIMES__。
  delete window[DATA_GLOBAL];
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = `${DATA_FILE}?t=${Date.now()}`;
    script.async = true;
    script.onload = () => {
      const data = window[DATA_GLOBAL];
      script.remove();
      if(!data) reject(new Error(`讀不到 ${DATA_FILE} 的資料內容`));
      else resolve({ data, from: DATA_FILE });
    };
    script.onerror = () => {
      script.remove();
      reject(new Error(`讀不到 ${DATA_FILE}`));
    };
    document.head.appendChild(script);
  });
}

// JSON 可能是純陣列，也可能包在物件裡，兩種都接
function normalize(data){
  if(Array.isArray(data)) return data;
  for(const k of ["showtimes","data","items","results"]){
    if(Array.isArray(data?.[k])) return data[k];
  }
  throw new Error("JSON 格式不認得，找不到場次陣列");
}

function boot(raw){
  ALL = normalize(raw);
  if(!ALL.length) throw new Error("資料是空的");

  // 舊資料沒有 start 欄位的話，臨時補一個，畫面才不會壞掉
  ALL.forEach(s => {
    if(!s.start) s.start = `${s.date}T${s.time}:00+08:00`;
  });

  const days = [...new Set(ALL.map(s => s.actual_date || s.date))].sort();
  $("dataInfo").textContent =
    `${ALL.length.toLocaleString()} 場　`+
    `${dayLabel(days[0])} ～ ${dayLabel(days[days.length-1])}`;

  // 預設選今天，沒有今天就選第一天
  //
  // 注意：不能用 toISOString()，那是 UTC 時間，
  // 台灣清晨 8 點前會算成「昨天」。
  // 這裡明確指定用台灣時區來判斷今天是幾號。
  const today = new Intl.DateTimeFormat("en-CA",
    { timeZone:"Asia/Taipei" }).format(new Date());

  buildFilters();
  $("fDate").value = days.includes(today) ? today : days[0];
  refreshDependent();

  renderResults();
  renderDock();
}

loadData()
  .then(({data}) => boot(data))
  .catch(err => {
    $("dataInfo").textContent = "資料載入失敗";
    $("results").innerHTML =
      `<p class="empty"><strong>讀不到場次資料</strong>
       ${htmlEsc(err.message)}<br><br>
       請確認 <code>${htmlEsc(DATA_FILE)}</code> 可公開存取，
       而且是透過網址開啟（不是直接點兩下開檔案）。</p>`;
  });
</script>
